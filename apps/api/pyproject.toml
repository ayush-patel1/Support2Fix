[project]
name = "support2fix-api"
version = "0.1.0"
description = "Support2Fix backend: FastAPI API, LangGraph worker, MCP tool servers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic migration files are semi-generated (autogenerate produces its own
# style, `Union`, unwrapped lines, ...) and are checked at runtime by
# actually applying them (see README), not by static lint/type rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is exactly the pattern B008 exists to
# catch elsewhere (a mutable/expensive default evaluated once at import
# time) — here it's the intended, documented way to parameterize a
# dependency (`Depends(require_role(Role.ADMIN))`). See app/api/deps.py.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "app.api.deps.require_role",
    "app.api.deps.require_any_role",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = "^alembic/versions/"

[[tool.mypy.overrides]]
# Test functions/fixtures are exempt from strict annotation requirements;
# application code (app.core, app.api, ...) still has to fully type-check.
# Both flags are needed: disallow_untyped_defs only covers functions with
# *zero* annotations (e.g. `def client():`); a partially-annotated test
# function (e.g. `def test_x(db_client: AsyncClient):`, param typed, return
# omitted) falls under disallow_incomplete_defs instead — strict mode turns
# both on, so relaxing just one still leaves the other firing.
module = "app.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

