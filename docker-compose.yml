# Local development topology. See docs/architecture/system-design.md §2, §11.
#
#   docker compose up --build
#
# web (3000) -> api (8000) -> postgres (5432). The browser only ever talks
# to `web`; `api` is exposed on the host too, for convenience (curl, docs).
name: support2fix

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support2fix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support2fix}
      POSTGRES_DB: ${POSTGRES_DB:-support2fix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support2fix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-support2fix}:${POSTGRES_PASSWORD:-support2fix}@postgres:5432/${POSTGRES_DB:-support2fix}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    env_file: .env
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
